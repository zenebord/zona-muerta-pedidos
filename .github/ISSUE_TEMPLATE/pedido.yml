name: Pedido
description: Una mejora que quieres o un error que encontraste en el juego
title: "[Sección] qué se pide, en pocas palabras"
body:
  - type: textarea
    id: pedido
    attributes:
      label: Qué se pide
      description: Cuéntanos tu idea con tus palabras: qué quieres que cambie o qué falla. Si tienes una captura, pégala aquí.
    validations:
      required: true
  - type: textarea
    id: dudas
    attributes:
      label: Qué falta confirmar
      description: Si algo no quedó claro, anótalo aquí (opcional).
  - type: input
    id: version
    attributes:
      label: Versión del juego en que se pidió
      description: Opcional. La que aparece en el juego, por ejemplo 20261118-2052-3d1f5e9
